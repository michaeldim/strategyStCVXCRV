name: coverage

on:
  push:
    branches:
      - master
      - develop
  pull_request:

env:
  FOUNDRY_PROFILE: ci
  ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
  FORK_URL: ${{ secrets.ETH_RPC_URL }}
  FOUNDRY_IGNORE_DEPLOY_SIZE: true

jobs:
  coverage:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
          
      # Configure Foundry to ignore deploy size (using environment variables)
      - name: Configure Foundry
        run: |
          # Already setting FOUNDRY_IGNORE_DEPLOY_SIZE in env
          forge config
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      # Enable Corepack to use the packageManager specified in package.json
      - name: Enable Corepack
        run: corepack enable
        
      # Install dependencies if needed
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install lcov
        run: sudo apt-get -y install lcov

      - name: Run generate html report
        run: make coverage-html

      - name: Generate summary report
        run: |
          lcov --summary lcov.info > coverage-report/summary.md
          sed -i '1d' coverage-report/summary.md
          sed -i '/Message summary:/,$d' coverage-report/summary.md

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoverageReport # Artifact name
          path: coverage-report # Directory containing files to upload

      - name: Add comment to PR
        if: github.event_name == 'pull_request' && env.GH_TOKEN != ''
        run: gh pr comment $PR_NUMBER --body-file coverage-report/summary.md
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}

      - name: Publish coverage in build summary
        run: cat coverage-report/summary.md >> $GITHUB_STEP_SUMMARY
        shell: bash
