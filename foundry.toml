[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc = "0.8.23"

optimizer = true
optimizer_runs = 10000

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
    "@tokenized-strategy/=lib/tokenized-strategy/src/",
    "@periphery/=lib/tokenized-strategy-periphery/src/",
]

# Fork settings with direct URL instead of environment variable
fork-url = "https://eth-mainnet.g.alchemy.com/v2/YOUR_ALCHEMY_API_KEY"
# fork_block_number = 18977460

# Additional configuration for testing
verbosity = 3
evm_version = "paris"
gas_reports = ["Strategy", "FixedStrategy"]

# Use proper management address from tests
sender = '0xcDb15392B5BC692dE20B3a4E29190B4DD1d6c63d'
tx_origin = '0xcDb15392B5BC692dE20B3a4E29190B4DD1d6c63d'

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
