[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc = "0.8.23"

optimizer = true
optimizer_runs = 10000

remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
  "@tokenized-strategy/=lib/tokenized-strategy/src/",
  "@periphery/=lib/tokenized-strategy-periphery/src/",
]

# fork_block_number = 18977460

# Additional configuration for testing
verbosity = 3
evm_version = "paris"
gas_reports = ["Strategy", "FixedStrategy"]
ignore_deploy_size = true

# Use proper management address from tests
sender = '0xcDb15392B5BC692dE20B3a4E29190B4DD1d6c63d'
tx_origin = '0xcDb15392B5BC692dE20B3a4E29190B4DD1d6c63d'

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
tenderly = "${TENDERLY_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
tenderly = { key = "${TENDERLY_ACCESS_KEY}", chain = 73571, url = "${TENDERLY_VERIFIER_URL}" }
# CI profile specifically for GitHub Actions
[profile.ci]
src = 'src'
out = 'out'
libs = ['lib']
solc = "0.8.23"
optimizer = true
optimizer_runs = 10000
ignore_deploy_size = true

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
